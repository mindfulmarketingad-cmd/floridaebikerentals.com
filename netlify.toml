# Netlify / Cloudflare Pages deployment for FloridaEbikeRentals.com
# Security and cache headers ship in dist/_headers, generated by the build.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# www is the canonical host, matching Vercel (the live host), which
# 308-redirects the bare domain to www.
[[redirects]]
  from = "https://floridaebikerentals.com/*"
  to = "https://www.floridaebikerentals.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
